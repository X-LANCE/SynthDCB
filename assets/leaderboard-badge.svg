<svg xmlns="http://www.w3.org/2000/svg" width="105" height="20" viewBox="0 0 105 20" role="img" aria-label="Leaderboard">
  <title>Leaderboard</title>
  <rect width="105" height="20" rx="3" fill="#875638"/>
  <g stroke="#563826" stroke-width=".6" stroke-linejoin="round">
    <rect x="5" y="8" width="6" height="8" rx="1" fill="#d5dce1"/>
    <rect x="11" y="4" width="7" height="12" rx="1" fill="#ffd15c"/>
    <rect x="18" y="10" width="6" height="6" rx="1" fill="#e4a078"/>
  </g>
  <g text-anchor="middle" font-family="Verdana, sans-serif" font-size="5" font-weight="bold" fill="#503529">
    <text x="8" y="14">2</text><text x="14.5" y="11">1</text><text x="21" y="15">3</text>
  </g>
  <text x="30" y="14" font-family="Verdana, sans-serif" font-size="11" fill="white">Leaderboard</text>
